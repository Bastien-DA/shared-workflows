name: Shared CD - Docker build & deploy for dotnet api

on:
    workflow_call:
        inputs:
            registry:
                description: "Registry host, e.g. registry.mycompany.com or registry.mycompany.com:5000"
                required: true
                type: string
            image-name:
                description: "Image name without registry (default: owner/repo in lowercase)"
                required: false
                type: string
                default: ""
            dockerfile:
                description: "Path to the Dockerfile"
                required: false
                type: string
                default: "Dockerfile"
            scan:
                description: "Scan the image with Trivy before pushing it (fails on findings)"
                required: false
                type: boolean
                default: true
            scan-severity:
                description: "Severities that make the scan fail"
                required: false
                type: string
                default: "CRITICAL,HIGH"
            deploy:
                description: "Deploy to the server after the push"
                required: false
                type: boolean
                default: true
            watchtower-url:
                description: "Base HTTPS URL of the Watchtower HTTP API, e.g. https://watchtower.mycompany.com"
                required: false
                type: string
                default: ""
            bump:
                description: "Version bump: auto (from #major/#minor/#patch in the PR title, patch by default), major, minor or patch (forces the bump, PR title ignored)"
                required: false
                type: string
                default: "auto"
            deploy-tag:
                description: "Moving tag run by the container on the server, pushed next to the version tag. Watchtower only re-pulls the tag a container was created with."
                required: false
                type: string
                default: "latest"
        secrets:
            REGISTRY_USERNAME:
                description: "Zot user the token belongs to"
                required: true
            REGISTRY_TOKEN:
                description: "Zot API key of that user, used as the registry password"
                required: true
            WATCHTOWER_TOKEN:
                description: "Bearer token of the Watchtower HTTP API"
                required: false

permissions:
    contents: write
    pull-requests: read

jobs:
    build:
        name: Version, build & push
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            version: ${{ steps.version.outputs.version }}

        steps:
            - name: Validate deploy configuration
              if: ${{ inputs.deploy }}
              env:
                  WATCHTOWER_URL: ${{ inputs.watchtower-url }}
                  WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
              run: |
                  # Fail before pushing anything if the deploy job could not run
                  missing=""
                  for v in WATCHTOWER_URL WATCHTOWER_TOKEN; do
                    [ -n "${!v}" ] || missing="$missing $v"
                  done
                  if [ -n "$missing" ]; then
                    echo "::error::deploy is enabled but these are missing:$missing"
                    exit 1
                  fi
                  # The bearer token must never travel in clear text
                  case "$WATCHTOWER_URL" in
                    https://*) ;;
                    *) echo "::error::watchtower-url must start with https://"; exit 1 ;;
                  esac

            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Compute next version
              id: version
              env:
                  GH_TOKEN: ${{ github.token }}
                  BUMP_INPUT: ${{ inputs.bump }}
              run: |
                  case "$BUMP_INPUT" in
                    auto|major|minor|patch) ;;
                    *) echo "::error::bump must be auto, major, minor or patch (got '$BUMP_INPUT')"; exit 1 ;;
                  esac

                  if [ "$BUMP_INPUT" = auto ]; then
                    TITLE=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].title // ""')
                    echo "PR title: $TITLE"

                    # #major / #minor / #patch (case-insensitive), patch by default
                    # grep exits 1 when nothing matches, which would abort the step (bash -e -o pipefail)
                    BUMP=$(echo "$TITLE" | { grep -oiE '#(major|minor|patch)' || true; } | head -1 | tr -d '#' | tr 'A-Z' 'a-z')
                    BUMP=${BUMP:-patch}
                  else
                    BUMP=$BUMP_INPUT
                  fi

                  LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
                  IFS=. read -r MA MI PA <<< "${LAST#v}"
                  case "$BUMP" in
                    major) MA=$((MA+1)); MI=0; PA=0 ;;
                    minor) MI=$((MI+1)); PA=0 ;;
                    patch) PA=$((PA+1)) ;;
                  esac

                  echo "Bump: $BUMP ($LAST -> v$MA.$MI.$PA)"
                  echo "version=$MA.$MI.$PA" >> "$GITHUB_OUTPUT"

            - name: Compute image reference
              id: image
              env:
                  REGISTRY: ${{ inputs.registry }}
                  IMAGE_NAME: ${{ inputs.image-name }}
              run: |
                  NAME=${IMAGE_NAME:-$GITHUB_REPOSITORY}
                  echo "image=$REGISTRY/${NAME,,}" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            - name: Build image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: ${{ inputs.dockerfile }}
                  load: true
                  tags: ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Scan image with Trivy
              if: ${{ inputs.scan }}
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}
                  severity: ${{ inputs.scan-severity }}
                  ignore-unfixed: true
                  exit-code: "1"
                  format: table

            - name: Tag git
              run: |
                  git tag "v${{ steps.version.outputs.version }}"
                  git push origin "v${{ steps.version.outputs.version }}"

            - name: Log in to the registry
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ${{ inputs.registry }}
                  username: ${{ secrets.REGISTRY_USERNAME }}
                  password: ${{ secrets.REGISTRY_TOKEN }}

            - name: Push image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: ${{ inputs.dockerfile }}
                  push: true
                  tags: |
                      ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}
                      ${{ steps.image.outputs.image }}:${{ inputs.deploy-tag }}
                  cache-from: type=gha

    deploy:
        name: Deploy with Watchtower
        needs: build
        if: ${{ inputs.deploy }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions: {}
        concurrency:
            group: deploy-${{ github.repository }}
            cancel-in-progress: false

        steps:
            - name: Trigger Watchtower update
              env:
                  WATCHTOWER_URL: ${{ inputs.watchtower-url }}
                  WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
              run: |
                  # The token goes through a curl config on stdin: never on the command line.
                  # HTTPS only (no redirect to http). The update is idempotent, so retrying is safe.
                  printf 'header = "Authorization: Bearer %s"\n' "$WATCHTOWER_TOKEN" | \
                    curl --fail --silent --show-error \
                      --proto '=https' --tlsv1.2 \
                      --retry 3 --retry-delay 5 --max-time 300 \
                      -K - -X POST "${WATCHTOWER_URL%/}/v1/update"
